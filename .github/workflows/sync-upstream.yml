name: Sync upstream

# Merges PeteZahGames main into this fork daily, re-applies AndiHub branding,
# pushes. If a merge conflicts, the run fails and you resolve it in the web editor.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge upstream
        run: |
          git config user.name "andihub-sync[bot]"
          git config user.email "andihub-sync[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/PeteZah-Games/PeteZahGames.git || true
          git fetch upstream main
          git merge --no-edit upstream/main
      - name: Re-apply branding
        run: node scripts/apply-branding.mjs
      - name: Commit and push
        run: |
          git add -A
          git diff --cached --quiet && echo "nothing to push" && exit 0
          git commit -m "chore: sync upstream + re-apply AndiHub branding"
          git push origin HEAD:main
