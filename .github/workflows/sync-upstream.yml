name: Sync upstream

# Merges PeteZahGames main into this fork daily, re-applies AndiHub branding,
# pushes. Pure-branding conflicts auto-resolve (take upstream, re-brand);
# anything structural fails loudly for manual resolution in the web editor.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge upstream
        run: |
          git config user.name "andihub-sync[bot]"
          git config user.email "andihub-sync[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/PeteZah-Games/PeteZahGames.git || true
          git fetch upstream main
          git merge --no-edit upstream/main || true
          CONFLICTS=$(git diff --name-only --diff-filter=U || true)
          if [ -n "$CONFLICTS" ]; then
            echo "conflicted files:"
            echo "$CONFLICTS"
            # Fork-structural + UX-clarity files: never auto-resolve, need a human.
            PROTECTED="package.json backend/utils/seo-meta.js backend/utils/secrets.js scripts/apply-branding.mjs branding.json branding FORK.md railway.json .github src/components/BrowserSidebar.tsx src/components/ContentArea.tsx src/hooks/useBrowserState.ts"
            MANUAL=0
            for f in $CONFLICTS; do
              SKIP=0
              for p in $PROTECTED; do
                case "$f" in "$p"|"$p"/*) SKIP=1; break;; esac
              done
              if [ "$SKIP" = "1" ]; then
                echo "MANUAL resolution needed: $f"
                MANUAL=1
              else
                echo "auto-resolving (take upstream, re-brand after): $f"
                git checkout --theirs -- "$f"
              fi
            done
            if [ "$MANUAL" = "1" ]; then
              echo "structural conflicts need manual resolution in the web editor"
              git merge --abort || true
              exit 1
            fi
          fi
      - name: Re-apply branding
        run: node scripts/apply-branding.mjs
      - name: Commit and push
        run: |
          git add -A
          git diff --cached --quiet && echo "nothing to push" && exit 0
          git commit -m "chore: sync upstream + re-apply AndiHub branding"
          git push origin HEAD:main
